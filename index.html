<title>Nabeel · nabl.in</title>
<meta name="description" content="Nabeel builds products and little experiments for the web.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  /* Deliberately single-theme: a white page, as the brief asks. */
  :root {
    color-scheme: light;
    --paper: #FFFFFF;
    --ink: #0D1117;
    --ink-2: #3A414C;
    --muted: #6E7582;
    --rule: #E7E9ED;
    --accent: #1D3FD6;
    --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    padding-inline: 24px;
  }
  .page {
    max-width: 720px;
    min-height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 48px;
    padding-block: 32px;
  }
  .label {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  header .clock { font-variant-numeric: tabular-nums; }
  .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 8px; vertical-align: 1px;
  }

  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 56px;
  }
  .intro { display: flex; flex-direction: column; gap: 20px; }
  h1 {
    margin: 0;
    font-size: clamp(52px, 11vw, 96px);
    font-weight: 600;
    line-height: 0.95;
    letter-spacing: -0.045em;
    text-wrap: balance;
  }
  h1 .stop { color: var(--accent); }
  .lede {
    margin: 0;
    max-width: 30ch;
    font-size: clamp(20px, 3.2vw, 26px);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.015em;
    color: var(--ink-2);
    text-wrap: balance;
  }

  .aside {
    margin: -8px 0 0;
    max-width: 36ch;
    font-size: clamp(16px, 2.2vw, 18px);
    line-height: 1.45;
    color: var(--muted);
  }
  .play { display: flex; flex-direction: column; gap: 12px; }
  .play-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  }
  .play-head .score { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 180px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    touch-action: manipulation;
    outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent); }
  .hint { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
  kbd {
    font-family: var(--mono); font-size: 11px;
    border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px;
    padding: 1px 5px; color: var(--ink-2);
  }

  footer {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    gap: 16px 32px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
  nav { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  nav a {
    font-size: 17px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--ink); text-decoration: none;
    background: linear-gradient(var(--accent), var(--accent)) 0 100% / 0 1.5px no-repeat;
    transition: background-size .25s ease, color .25s ease;
    padding-bottom: 2px;
  }
  nav a:hover, nav a:focus-visible { color: var(--accent); background-size: 100% 1.5px; outline: none; }
  nav a .arr { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: 3px; }

  @media (max-width: 480px) {
    body { padding-inline: 16px; }
    .page { gap: 36px; padding-block: 20px; }
    main { gap: 40px; }
    .hint .desk { display: none; }
    nav { gap: 8px 20px; }
  }
  @media (hover: none) { .hint .desk { display: none; } }
  @media (hover: hover) { .hint .touch { display: none; } }
  @media (prefers-reduced-motion: reduce) { nav a { transition: none; } }
</style>

<div class="page">
  <header>
    <span class="label"><span class="dot" aria-hidden="true"></span>nabl.in</span>
    <span class="label clock" id="clock">IST --:--</span>
  </header>

  <main>
    <section class="intro">
      <h1>Nabeel<span class="stop">.</span></h1>
      <p class="lede">I build products and little experiments for the web.</p>
      <p class="aside">I code, break things, fix them, and ship them.</p>
    </section>

    <section class="play" aria-label="A small running game">
      <div class="play-head">
        <span class="label">Jump the punctuation</span>
        <span class="label score" id="score">000000 · HI 000000</span>
      </div>
      <canvas id="game" tabindex="0" aria-label="Runner game. Press space or tap to jump, down arrow to duck."></canvas>
      <p class="hint">
        <span class="desk"><kbd>Space</kbd> jump · <kbd>↓</kbd> duck</span>
        <span class="touch">Tap to jump</span>
      </p>
    </section>
  </main>

  <footer>
    <nav aria-label="Find me">
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub<span class="arr">↗</span></a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn<span class="arr">↗</span></a>
      <a href="mailto:nabeel.creator@gmail.com">Email<span class="arr">↗</span></a>
      <a href="https://wa.me/" target="_blank" rel="noopener">WhatsApp<span class="arr">↗</span></a>
    </nav>
    <span class="label">© 2026</span>
  </footer>
</div>

<script>
(() => {
  /* ---------- clock ---------- */
  const clock = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Kolkata' });
  const tick = () => { clock.textContent = 'IST ' + fmt.format(new Date()); };
  tick(); setInterval(tick, 15000);

  /* ---------- game ---------- */
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const css = getComputedStyle(document.documentElement);
  const C = {
    ink: css.getPropertyValue('--ink').trim(),
    muted: css.getPropertyValue('--muted').trim(),
    rule: css.getPropertyValue('--rule').trim(),
    accent: css.getPropertyValue('--accent').trim(),
    paper: css.getPropertyValue('--paper').trim(),
  };
  const MONO = css.getPropertyValue('--mono').trim();

  let W = 0, H = 180, dpr = 1, GROUND = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    GROUND = H - 34;
    if (state !== 'run') draw();
  }

  const GLYPHS = ['{', '}', ';', '/', '#', '&', '%', '?', '!'];
  const player = { x: 44, y: 0, vy: 0, w: 22, h: 26, duck: false, onGround: true };
  let obstacles = [], specks = [];
  let state = 'idle';           // idle | run | over
  let speed, dist, spawnIn, last = 0, legT = 0, hi = 0;

  try { hi = parseInt(localStorage.getItem('nabl-hi') || '0', 10) || 0; } catch (e) {}

  function reset() {
    obstacles = [];
    specks = Array.from({ length: 14 }, () => ({ x: Math.random() * W, y: GROUND + 8 + Math.random() * 18, w: 2 + Math.random() * 6 }));
    speed = 360; dist = 0; spawnIn = 0.9;
    player.y = GROUND - player.h; player.vy = 0; player.duck = false; player.onGround = true;
    updateScore();
  }

  const pad = n => String(Math.floor(n)).padStart(6, '0');
  function updateScore() { scoreEl.textContent = pad(dist / 10) + ' · HI ' + pad(hi); }

  function jump() {
    if (state !== 'run') { start(); return; }
    if (player.onGround && !player.duck) { player.vy = -760; player.onGround = false; }
  }
  function start() {
    reset(); state = 'run'; last = performance.now();
    requestAnimationFrame(loop);
  }

  function spawn() {
    const score = dist / 10;
    if (score > 250 && Math.random() < 0.28) {
      // a flying dash: duck under it or jump over it
      const high = Math.random() < 0.5;
      obstacles.push({ kind: 'fly', ch: '—', x: W + 20, y: high ? GROUND - 46 : GROUND - 30, w: 30, h: 8 });
    } else {
      const ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
      const size = 38 + Math.random() * 12;
      ctx.font = `700 ${size}px ${MONO}`;
      const w = Math.max(14, ctx.measureText(ch).width - 4);
      obstacles.push({ kind: 'glyph', ch, size, x: W + 20, y: GROUND - size * 0.78, w, h: size * 0.78 });
      if (score > 120 && Math.random() < 0.22) {
        const ch2 = GLYPHS[(Math.random() * GLYPHS.length) | 0];
        obstacles.push({ kind: 'glyph', ch: ch2, size, x: W + 20 + w + 2, y: GROUND - size * 0.78, w, h: size * 0.78 });
      }
    }
    const gap = 0.75 + Math.random() * 0.9;
    spawnIn = gap * Math.max(0.6, 420 / speed);
  }

  function hit(a, b) {
    const m = 3;
    return a.x + m < b.x + b.w && a.x + a.w - m > b.x && a.y + m < b.y + b.h && a.y + a.h - m > b.y;
  }

  function loop(now) {
    if (state !== 'run') return;
    const dt = Math.min(0.033, (now - last) / 1000); last = now;

    speed = Math.min(900, speed + 9 * dt);
    dist += speed * dt / 6;

    // player physics
    const targetH = player.duck && player.onGround ? 14 : 26;
    const targetW = player.duck && player.onGround ? 30 : 22;
    player.vy += (player.duck && !player.onGround ? 4200 : 2300) * dt;
    player.y += player.vy * dt;
    player.h = targetH; player.w = targetW;
    if (player.y >= GROUND - player.h) { player.y = GROUND - player.h; player.vy = 0; player.onGround = true; }
    legT += dt * speed / 40;

    spawnIn -= dt; if (spawnIn <= 0) spawn();
    for (const o of obstacles) o.x -= speed * dt * (o.kind === 'fly' ? 1.12 : 1);
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    for (const s of specks) { s.x -= speed * dt; if (s.x < -10) { s.x = W + Math.random() * 40; s.y = GROUND + 8 + Math.random() * 18; } }

    for (const o of obstacles) if (hit(player, o)) { gameOver(); return; }

    if (Math.floor(dist / 10) > hi) hi = Math.floor(dist / 10);
    updateScore();
    draw();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    try { localStorage.setItem('nabl-hi', String(hi)); } catch (e) {}
    updateScore();
    draw();
  }

  function drawPlayer() {
    const p = player;
    ctx.fillStyle = state === 'over' ? C.accent : C.ink;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w, p.h - (p.onGround ? 4 : 0));
    // eye
    ctx.fillStyle = C.paper;
    const ex = p.x + p.w - 8, ey = p.y + 5;
    if (state === 'over') {
      ctx.fillRect(ex, ey, 5, 1.5); ctx.fillRect(ex + 1.75, ey - 1.75, 1.5, 5);
    } else {
      ctx.fillRect(ex, ey, 4, 4);
    }
    // legs
    if (p.onGround) {
      ctx.fillStyle = state === 'over' ? C.accent : C.ink;
      const step = state === 'run' ? (Math.floor(legT) % 2) : 0;
      const by = p.y + p.h - 4;
      ctx.fillRect(p.x + 4, by, 4, step ? 4 : 2);
      ctx.fillRect(p.x + p.w - 8, by, 4, step ? 2 : 4);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // ground
    ctx.fillStyle = C.ink;
    ctx.fillRect(0, GROUND, W, 1.5);
    ctx.fillStyle = C.rule;
    for (const s of specks) ctx.fillRect(s.x, s.y, s.w, 1.5);

    // obstacles
    ctx.textBaseline = 'alphabetic';
    for (const o of obstacles) {
      if (o.kind === 'fly') {
        ctx.fillStyle = C.ink;
        ctx.fillRect(o.x, o.y + 2, o.w, 3);
      } else {
        ctx.fillStyle = C.ink;
        ctx.font = `700 ${o.size}px ${MONO}`;
        ctx.fillText(o.ch, o.x - 2, GROUND - 1);
      }
    }

    drawPlayer();

    if (state !== 'run') {
      ctx.textAlign = 'center';
      ctx.fillStyle = C.ink;
      ctx.font = `600 15px ${getComputedStyle(document.body).fontFamily}`;
      const title = state === 'over' ? 'Game over.' : 'Ready when you are.';
      ctx.fillText(title, W / 2, H / 2 - 22);
      ctx.fillStyle = C.muted;
      ctx.font = `500 11px ${MONO}`;
      const touch = matchMedia('(hover: none)').matches;
      const msg = (touch ? 'TAP' : 'SPACE OR CLICK') + (state === 'over' ? ' TO RETRY' : ' TO START');
      ctx.fillText(msg, W / 2, H / 2);
      ctx.textAlign = 'left';
    }
  }

  // input
  const isJumpKey = e => e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w';
  window.addEventListener('keydown', e => {
    const t = e.target;
    if (t && (t.tagName === 'A' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (isJumpKey(e)) { e.preventDefault(); if (!e.repeat) jump(); }
    else if (e.code === 'ArrowDown' || e.key === 's') { e.preventDefault(); player.duck = true; }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowDown' || e.key === 's') player.duck = false;
  });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus({ preventScroll: true }); jump(); });

  window.addEventListener('resize', resize);
  resize(); reset(); draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state !== 'run') draw(); });
})();
</script>
